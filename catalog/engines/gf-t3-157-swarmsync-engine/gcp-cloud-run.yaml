apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: gf-t3-157-swarmsync
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/ingress-status: all
    run.googleapis.com/execution-environment: gen2
    run.googleapis.com/cpu-throttling: "false"
    run.googleapis.com/security-policy: "swarm-armor-ddos-policy"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "2"
        autoscaling.knative.dev/maxScale: "64"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/cloud-trace-enabled: "true"
    spec:
      containerConcurrency: 1000
      timeoutSeconds: 300
      serviceAccountName: swarmsync-edge-sa@ghostfactoryos.iam.gserviceaccount.com
      containers:
        - image: gcr.io/ghost-factoryos/gf-t3-157-swarmsync:1.5.7
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "4000m"
              memory: "4Gi"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          env:
            - name: ENGINE_ASSET_TAG
              value: "GF-T3-157"
            - name: FIXED_POINT_SCALE
              value: "1000000"
            - name: CBF_ALPHA_GAIN
              value: "1.8"
            - name: GOOGLE_CLOUD_PROJECT
              value: "ghost-factoryos"
            - name: ESCROW_VAULT_KEY
              valueFrom:
                secretKeyRef:
                  name: swarm-vault-credentials
                  key: key
