name: AegisSovereign Engine CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  cryptographic-verification-and-test:
    name: Run Python Math Verification & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Mathematical & Settlement Tests
        run: |
          python3 tests/test_settlement.py

      - name: Clean-Room License & Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  container-build-cloud-run:
    name: Build Distroless Container & Deploy to Cloud Run
    needs: cryptographic-verification-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Distroless Docker Image
        run: |
          docker build -t aegis-sovereign-engine:latest .

      - name: Verify Container Health
        run: |
          docker run -d -p 8080:8080 --name test-engine aegis-sovereign-engine:latest
          sleep 3
          curl -f http://localhost:8080/healthz || exit 1
          docker stop test-engine
