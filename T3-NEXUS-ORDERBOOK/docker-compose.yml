version: "3.9"

services:
  nexus-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: t3_nexus_engine
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - APP_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nexus_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus_db}
      - REDIS_URL=redis://redis:6379/0
      - TICK_INTERVAL_MS=100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "1.0"
          memory: 1024M

  postgres:
    image: postgres:16-alpine
    container_name: t3_nexus_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_admin -d nexus_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: t3_nexus_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
