version: '3.8'

services:
  sol-rotor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gf-t3-147-sol-rotor
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - LOG_LEVEL=INFO
      - AIRFRAME_ID=GF-T3-147
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
