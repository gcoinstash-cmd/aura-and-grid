version: '3.8'

services:
  hyperion-flux:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gf-t3-146-hyperion-flux
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - LOG_LEVEL=INFO
      - SENSOR_WIDTH=256
      - SENSOR_HEIGHT=256
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
