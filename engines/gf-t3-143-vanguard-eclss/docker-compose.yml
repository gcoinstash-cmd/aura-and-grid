version: '3.8'

services:
  vanguard-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: gf-t3-143-vanguard-eclss:1.0.0
    container_name: gf_t3_143_vanguard_eclss
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - LOG_LEVEL=INFO
      - ALLOYDB_HOST=alloydb-primary.internal
      - ALLOYDB_PORT=5432
      - ALLOYDB_DB=vanguard_telemetry
      - ALLOYDB_USER=vanguard_app
      - NODE_ID=VANGUARD-OUTPOST-01
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 3
